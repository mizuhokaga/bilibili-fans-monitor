name: B站数据抓取与存档

on:
  workflow_dispatch: # 手动触发
  schedule:
    - cron: '0 9 * * *' # 每天 UTC 09:00 = 北京时间 17:00 自动运行

# 同一时间只允许一个实例运行，避免两次提交互相冲突
concurrency:
  group: bilibili-crawler
  cancel-in-progress: false

jobs:
  crawl-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 设置写入仓库的权限
    permissions:
      contents: write

    steps:
      # 1. 检出代码（actions/checkout v5 起使用 Node 24，不再有 Node 20 弃用警告）
      - name: 检出代码 (使用 Token)
        uses: actions/checkout@v5
        with:
          # 使用密钥中名为 GITHUB_TOKEN 的令牌
          token: ${{ secrets.GITHUB_TOKEN }}
          # 拉取全部提交历史，这对推送很重要
          fetch-depth: 0

      # 2. 设置Python环境
      # 注意：ubuntu-latest 现在已经是 Ubuntu 26.04，而 Python 3.9 已停止支持(EOL)，
      #       官方不再为 26.04 构建 3.9 的安装包，因此改用仍在支持期内的 3.12。
      - name: 设置Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      # 3. 安装依赖
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 运行抓取脚本 (main.py)
      - name: 运行抓取脚本
        run: python main.py

      # 5. 配置Git用户并推送更改
      - name: 提交并推送数据文件
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add bilibili_data_log.txt

          # 文件没有变化则直接结束，不做空提交
          if git diff --cached --quiet; then
            echo "没有新内容可提交"
            exit 0
          fi

          git commit -m "📈 Auto-update B站数据抓取日志 [skip ci]"

          # 先同步远端再推送，失败时重试几次，避免偶发的推送冲突导致任务失败
          for i in 1 2 3; do
            git pull --rebase --autostash origin "$BRANCH" || true
            if git push origin "HEAD:$BRANCH"; then
              echo "推送成功"
              exit 0
            fi
            echo "第 $i 次推送失败，5 秒后重试..."
            sleep 5
          done

          echo "推送失败，请检查仓库权限" >&2
          exit 1
